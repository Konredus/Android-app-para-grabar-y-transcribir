plugins { id 'com.android.application' }
android {
    namespace 'cl.vozlocal.app'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.vozlocal.app'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.8.0'
        testInstrumentationRunner 'cl.vozlocal.app.RecorderSmokeTest'
