plugins { id 'com.android.application' }
android {
    namespace 'cl.vozlocal.app'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.vozlocal.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'cl.vozlocal.app.RecorderSmokeTest'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.android.gms:play-services-auth:22.0.0' }
